<!DOCTYPE html>
<html lang='en'>
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101d28">
<meta name="description" content="SOLMAR HEAT — an original top-down open-world crime game set in the fictional city of Solmar Bay: steal cars, outrun the police, run five story missions.">
<link rel="icon" type="image/x-icon" href="data:,">
<title>SOLMAR HEAT — an open-world crime story in Solmar Bay</title>
<style type="text/css">
  /* The page is only a frame; the canvas owns the whole window. */
  html, body { height: 100%; margin: 0; overflow: hidden; background: #101d28; }
  #game { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; touch-action: none; }
  /* Live region for screen readers: announced, never visible. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  noscript p { padding: 2rem; color: #f5f1e6; font: 16px/1.5 system-ui, sans-serif; }
</style></head>
<body><canvas id="game" aria-label="SOLMAR HEAT, an open-world crime game in Solmar Bay. Walk and drive through the city, steal cars, escape the police, and finish Rico's five missions."></canvas>
<p role="status" aria-live="polite" id="status"></p>
<noscript><p>SOLMAR HEAT needs JavaScript to play — a plain static game that makes no network requests.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body></html>
