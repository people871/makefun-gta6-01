<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SOLMAR HEAT — an original top-down open-world crime game in the fictional city of Solmar Bay: steal cars, outrun the police, run 5 story missions.">
<link rel="icon" href="data:,">
<title>SOLMAR HEAT — an open-world crime story in Solmar Bay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1a24; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  noscript p { color: #f5f1e6; font: 16px system-ui, sans-serif; padding: 2em; }
</style>
</head>
<body>
<canvas id="game" aria-label="SOLMAR HEAT: an open-world crime game in Solmar Bay. Walk and drive around the city, steal cars, outrun the police, and complete Rico's missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p>SOLMAR HEAT needs JavaScript to run — it is a plain static game with no network requests.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
